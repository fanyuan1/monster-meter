<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      // Mirrors src/state/theme.ts.
      (function () {
        var pref = "system";
        try {
          pref = JSON.parse(localStorage.getItem("monster-meter-settings") || "{}").theme || "system";
        } catch (e) {}
        if (pref !== "system") document.documentElement.dataset.theme = pref;
        var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#141c2f" : "#ffffff");
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" = dark status text on white. black-translucent forces white text,
         which is unreadable over this light theme. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MonsterMeter" />
    <title>MonsterMeter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
